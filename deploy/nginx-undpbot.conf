# Point https://revisionafrica.com/undpbot at the askBack admin panel.
# Include this inside the server { } block that already serves revisionafrica.com.
# The Node app must be running with BASE_PATH=/undpbot

location = /undpbot {
  return 302 /undpbot/;
}

location /undpbot/ {
  proxy_pass http://127.0.0.1:3000/undpbot/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_read_timeout 300s;
  client_max_body_size 80m;
}
